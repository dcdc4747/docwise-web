[project]
name = "docwise-web-backend"
version = "0.1.0"
description = "docwise-web 后端（FastAPI + SQLAlchemy + SQLite）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 显式钉死规则集，保证 CI 与本地 lint 口径一致
select = ["E", "F", "I", "UP"]
